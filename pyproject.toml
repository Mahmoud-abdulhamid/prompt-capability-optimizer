[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-capability-optimizer"
version = "1.0.0"
description = "Production-grade, cross-agent prompt optimization and capability discovery meta-skill."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Mahmoud", email = "Develper.net@gmail.com" }
]
maintainers = [
    { name = "Mahmoud", email = "Develper.net@gmail.com" }
]
keywords = ["ai-agent", "prompt-engineering", "skills", "mcp", "optimization", "discovery"]

[project.urls]
"Author" = "mailto:Develper.net@gmail.com"

[project.scripts]
prompt-capability-optimizer = "prompt_capability_optimizer.cli:main"
